{% extends "base.html" %}

{% block title %}Sign In - Customer Feedback Intelligence{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card-cfi p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
            <i class="bi bi-shield-lock-fill fs-3"></i>
          </div>
          <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
          <p class="text-secondary small">Sign in to access your feedback datasets and analytics</p>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none border-0 small" role="alert"></div>

        <form id="loginForm" method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="usernameInput" class="form-label text-secondary small fw-medium">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-subtle text-secondary"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control form-control-cfi" id="usernameInput" name="username" placeholder="Enter your username" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
              <label for="passwordInput" class="form-label text-secondary small fw-medium">Password</label>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-dark border-subtle text-secondary"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control form-control-cfi" id="passwordInput" name="password" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary-cfi w-100 py-2 mb-3">
            <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
            <span id="btnText">Sign In</span>
          </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top border-subtle">
          <span class="text-secondary small">Don't have an account?</span>
          <a href="{% url 'accounts:register' %}" class="text-primary small fw-medium ms-1 text-decoration-none">Create account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const alertEl = document.getElementById('loginAlert');
  const btnSpinner = document.getElementById('btnSpinner');
  const btnText = document.getElementById('btnText');
  const submitBtn = document.getElementById('submitBtn');

  alertEl.classList.add('d-none');
  btnSpinner.classList.remove('d-none');
  btnText.textContent = 'Authenticating...';
  submitBtn.disabled = true;

  const username = document.getElementById('usernameInput').value.trim();
  const password = document.getElementById('passwordInput').value;

  try {
    const data = await apiFetch('/api/auth/login/', {
      method: 'POST',
      body: { username, password }
    });
    window.location.href = '/dashboard/';
  } catch (err) {
    alertEl.textContent = err.message || 'Invalid username or password.';
    alertEl.classList.remove('d-none');
  } finally {
    btnSpinner.classList.add('d-none');
    btnText.textContent = 'Sign In';
    submitBtn.disabled = false;
  }
});
</script>
{% endblock %}
